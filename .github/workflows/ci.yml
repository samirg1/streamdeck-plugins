name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jira:
    name: Jira plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jira
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jira/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and test
        run: npm run validate
      - name: Validate Stream Deck package
        run: npm run plugin:validate
